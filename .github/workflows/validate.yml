name: Validate records

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate records
        run: python3 scripts/validate_records.py
      - name: Build views (check only, do not publish)
        run: python3 scripts/build_views.py --out /tmp/missing-links-views
